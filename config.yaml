# 쇼츠 자동화 설정
channel:
  niche: "과학·생활 팁"    # 메인. 밈/썰 쇼츠는 추후 추가
  language: ko
  topics:                    # 2단계(주제 검증)에서 비교할 세부 주제 3개
    science:
      name: "일상 속 과학 원리"
      guide: "'왜 ~할까?' 형식. 누구나 겪은 현상 → 원리 한 줄 → 반전/활용. 물리·화학·생물 상식 위주"
    kitchen:
      name: "주방·청소 꿀팁"
      guide: "'~하지 마세요 / ~하면 두 배' 형식. 원리가 설명되는 팁만. 위험한 혼합(예: 세제 혼합) 안전 경고 포함"
    habit:
      name: "습관·수면 상식"
      guide: "연구 기반 상식. 표현 수위 엄격: 치료·예방 단정 금지, '~라는 연구가 있다' 수준, 개인차 언급"
  persona: "궁금증을 콕 짚어주는 똑똑한 친구 말투. 반말, 짧은 호흡, 결론부터 말하고 이유를 설명"

video:
  width: 1080
  height: 1920
  fps: 30
  max_seconds: 45

llm:
  model: claude-sonnet-5-5   # 환경변수 ANTHROPIC_API_KEY 필요

tts:
  provider: edge             # edge(무료) | 추후 elevenlabs 등으로 교체
  voices:
    narrator: {name: ko-KR-InJoonNeural, rate: "+15%", pitch: "+0Hz"}
    funny:    {name: ko-KR-SunHiNeural,  rate: "+30%", pitch: "+25Hz"}   # 빠르고 높은 톤
    deep:     {name: ko-KR-InJoonNeural, rate: "-5%",  pitch: "-30Hz"}   # 진지한 척하는 낮은 톤

assets:
  pexels_api_key_env: PEXELS_API_KEY
  meme_dir: assets/memes     # 직접 큐레이션한 짤 폴더: memes/<태그>/*.png|gif|mp4
  sfx_dir: assets/sfx        # 효과음: sfx/<이름>.mp3 (뿅, 두둥, 띠로리 등)
  font: assets/fonts/Pretendard-ExtraBold.otf   # 직접 넣어야 함

upload:
  enabled: false             # 처음엔 끄고 결과물 확인 후 켜기
  privacy: private
